name: Build NDS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-nds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in devkitPro container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/toolchain-base:20250727 \
            bash -lc "dkp-pacman -Syu --noconfirm --needed nds-dev && make clean && make"

      - name: Package output
        run: |
          set -euo pipefail
          mkdir -p dist
          NDS_PATH="$(find . -maxdepth 6 -type f -name '*.nds' | head -n 1 || true)"
          if [ -z "${NDS_PATH}" ]; then
            echo "ERROR: No .nds found after build."
            find . -maxdepth 6 -type f
            exit 1
          fi
          echo "Found .nds at: ${NDS_PATH}"
          cp "${NDS_PATH}" dist/PPLSYLLABUSDS.nds
          (cd dist && zip -9 PPLSYLLABUSDS.nds.zip PPLSYLLABUSDS.nds)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPLSYLLABUSDS-nds
          path: dist/PPLSYLLABUSDS.nds.zip
          retention-days: 30
